<div class="booking-container">
  <h2>Creazione Prenotazione Posti</h2>

  <form #bookingForm="ngForm" (ngSubmit)="addBooking()">

    <div class="form-group">
      <label for="utente">Seleziona Utente:</label>
      <select id="utente" name="utente" [(ngModel)]="prenotazione.utenteId" required>
        <option value="" disabled selected>Scegli un utente...</option>
        <option *ngFor="let utente of listaUtenti" [value]="utente.id">
          {{ utente.firstName }} {{ utente.lastName }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label for="data">Data Prenotazione:</label>
      <input type="date" (change)="SpacesAvailable()" id="data" name="data" [(ngModel)]="prenotazione.data" required />
    </div>

      <label for="PostazioneRiunioni">Postazione:</label>
      <select (change)="SlotsAvailable(getSpaceId(prenotazione.postazione))"id="PostazioneRiunioni" name="PostazioneRiunioni" [(ngModel)]="prenotazione.postazione" required>
        <option value="" disabled selected>Scegli la postazione...</option>
        <div *ngFor="let s of Spaces">
        <option [value]="s.name">{{ s.name }}</option>
        </div>
      </select>
  <div class="form-group">
    <label for="slotMezzaGiornata">Durata Prenotazione:</label>
    <select [formControl]="select" id="slotMezzaGiornata" name="slotMezzaGiornata" [(ngModel)]="prenotazione.slotOrario" required>
      <option value="" disabled selected>Scegli la fascia oraria...</option>
      <div *ngFor="let s of Slots">
        <option (click)="saveIndex(s.id)" [value]="s.id">{{ s.start|date:'HH:mm' }}</option>
      </div>
    </select>
  </div>
<div class="form-actions">
  <button type="submit" [disabled]="!bookingForm.form.valid" class="btn-conferma">
    Conferma Prenotazione
  </button>
</div>
</form>
</div>
