<div class="container">
    <h2 class="mb-4">Reservations</h2>

    <div class="mb-3 row">
        <div class="col-sm-4">
            <input type="text" class="form-control" placeholder="Search reservations by user name..."
                [formControl]="searchControl">
        </div>
        <div class="col-sm-2">
            <button class="btn btn-primary w-100" (click)="applyFilterAndSort()">
                <i class="bi bi-search"></i> Search
            </button>
        </div>
        <div class="col-sm-2">
            <button class="btn btn-secondary w-100" (click)="clearSearch()" [class.disabled]="!searchControl.value">
                <i class="bi bi-x"></i> Clear
            </button>
        </div>
        <div class="col-sm-1">
            <div class="dropdown-center">
                <button class="btn btn-secondary w-100" type="button" data-bs-toggle="dropdown"
                    data-bs-auto-close="outside" aria-expanded="false">
                    <i class="bi bi-filter"></i>
                </button>
                <div class="dropdown-menu filter-dropdown-menu p-3" [formGroup]="dateForm">
                    <div class="mb-2">
                        <label class="form-label small fw-bold">From:</label>
                        <input type="date" class="form-control form-control-sm" formControlName="fromDate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">To:</label>
                        <input type="date" class="form-control form-control-sm" formControlName="toDate">
                    </div>
                    <button class="btn btn-sm btn-primary w-100" (click)="loadBookings()">Apply Filters</button>
                </div>
            </div>
        </div>
        <div class="col-sm-3">
            <button class="btn btn-success w-100" (click)="goCreate()">
                <i class="bi bi-plus"></i> Add Reservation
            </button>
        </div>
    </div>

    <div class="table-wrapper border rounded-2 shadow-sm">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th class="clickable-area" scope="col" (click)="sortBy('id')">
                        <i class="bi" [class.bi-sort-numeric-down]="sortKey === 'id' && sortDirection === 'asc'"
                            [class.bi-sort-numeric-up]="sortKey === 'id' && sortDirection === 'desc'"></i>
                        ID
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('date')">
                        <i class="bi" [class.bi-sort-numeric-down]="sortKey === 'date' && sortDirection === 'asc'"
                            [class.bi-sort-numeric-up]="sortKey === 'date' && sortDirection === 'desc'"></i>
                        Start time
                    </th>
                    <th scope="col">End time</th>
                    <th class="clickable-area" scope="col" (click)="sortBy('spaceName')">
                        <i class="bi" [class.bi-sort-alpha-down]="sortKey === 'spaceName' && sortDirection === 'asc'"
                            [class.bi-sort-alpha-up]="sortKey === 'spaceName' && sortDirection === 'desc'"></i>
                        Space
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('userName')">
                        <i class="bi" [class.bi-sort-alpha-down]="sortKey === 'userName' && sortDirection === 'asc'"
                            [class.bi-sort-alpha-up]="sortKey === 'userName' && sortDirection === 'desc'"></i>
                        User
                    </th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (b of sortedBookings; track b.id) {
                <tr>
                    <td>{{ b.id }}</td>
                    <td>{{ b.start | date:'yyyy-MM-dd HH:mm' }}</td>
                    <td>{{ b.end | date:'yyyy-MM-dd HH:mm' }}</td>
                    <td>{{ b.space.name }}</td>
                    <td>{{ b.user.firstName }} {{ b.user.lastName }}</td>
                    <td>
                        <button class="btn btn-sm btn-secondary me-2" (click)="viewDetails(b)">
                            <i class="bi bi-info-circle"></i> View
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="cancelReservation(b)">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="6" class="text-center text-muted">Nessuna prenotazione trovata.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
