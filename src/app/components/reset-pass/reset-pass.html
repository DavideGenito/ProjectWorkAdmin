<div class="modal fade show d-block modal-backdrop-overlay" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content shadow-lg">

            <div class="modal-header">
                <h5 class="modal-title">Reset Password Utente #{{ userId }}</h5>
                <button type="button" class="btn-close" (click)="annulla()" aria-label="Close"></button>
            </div>

            <div class="modal-body">
                <div class="mb-3">
                    <label for="passInput" class="form-label">Nuova Password</label>
                    <input type="password" id="passInput" class="form-control" [formControl]="password"
                        placeholder="Inserisci almeno 8 caratteri">
                </div>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" (click)="annulla()">Annulla</button>
                <button type="button" class="btn btn-primary px-4" [disabled]="password.invalid" (click)="salva()">
                    Salva
                </button>
            </div>

        </div>
    </div>
</div>
