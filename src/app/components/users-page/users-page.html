<div class="container">
    <h2 class="mb-4">Users Management</h2>

    <div class="mb-3 row">
        <div class="col-sm-8">
            <input type="text" class="form-control" placeholder="Search users by name...">
        </div>
        <div class="col-sm-2">
            <button class="btn btn-primary w-100">
                <i class="bi bi-search"></i> Search
            </button>
        </div>
        <div class="col-sm-2">
            <button class="btn btn-success w-100" (click)="createUser()">
                <i class="bi bi-plus"></i> Create User
            </button>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th scope="col">ID</th>
                    <th scope="col">Name</th>
                    <th scope="col">Surname</th>
                    <th scope="col">Email</th>
                    <th scope="col">Role</th>
                    <th scope="col">Credit</th>
                    <th scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (u of userList.allUser; track $index) {
                    <tr>
                        <td>{{ u.id }}</td>
                        <td>{{ u.firstName }}</td>
                        <td>{{ u.lastName }}</td>
                        <td>{{ u.email }}</td>
                        <td>{{ u.role }}</td>
                        <td>{{ u.credit }}</td>
                        <td>
                            <button class="btn btn-sm btn-primary me-2" (click)="editUser(u)">
                                <i class="bi bi-pencil"></i> Edit
                            </button>
                            <button class="btn btn-sm btn-secondary me-2" (click)="resetPassword(u)">
                                <i class="bi bi-asterisk"></i> Change Pass
                            </button>
                            <button class="btn btn-sm btn-danger" (click)="deleteUser(u.id)">
                                <i class="bi bi-trash"></i> Delete
                            </button>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>

@if (mostraResetPass) {
  <app-reset-pass 
    [userId]="idUtenteSelezionato" 
    (confermato)="eseguiResetPassword($event)" 
    (annullato)="mostraResetPass = false">
  </app-reset-pass>
}
