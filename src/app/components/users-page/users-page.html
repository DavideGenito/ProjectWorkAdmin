<div class="container">
    <h2 class="mb-4">Users Management</h2>

    <div class="mb-3 row">
        <div class="col-sm-6">
            <input type="text" class="form-control" placeholder="Search users by name..." [formControl]="search">
        </div>
        <div class="col-sm-2">
            <button class="btn btn-primary w-100" (click)="searchUsers()">
                <i class="bi bi-search"></i> Search
            </button>
        </div>
        <div class="col-sm-2">
            <button class="btn btn-secondary w-100" (click)="clearSearch()" [class.disabled]="!search.value">
                <i class="bi bi-x"></i> Clear   
            </button>
        </div>
        <div class="col-sm-2">
            <button class="btn btn-success w-100" (click)="createUser()">
                <i class="bi bi-plus"></i> Create User
            </button>
        </div>
    </div>

    <div class="table-wrapper border rounded-2 shadow-sm">
        <table class="table table-striped table-bordered">
            <thead>
                <tr>
                    <th class="clickable-area" scope="col" (click)="sortBy('id')">
                        <i class="bi" [class.bi-sort-numeric-down]="sortKey === 'id' && sortDirection === 'asc'"
                            [class.bi-sort-numeric-up]="sortKey === 'id' && sortDirection === 'desc'"></i>
                        ID
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('firstName')">
                        <i class="bi" [class.bi-sort-alpha-down]="sortKey === 'firstName' && sortDirection === 'asc'"
                            [class.bi-sort-alpha-up]="sortKey === 'firstName' && sortDirection === 'desc'"></i>
                        Name
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('lastName')">
                        <i class="bi" [class.bi-sort-alpha-down]="sortKey === 'lastName' && sortDirection === 'asc'"
                            [class.bi-sort-alpha-up]="sortKey === 'lastName' && sortDirection === 'desc'"></i>
                        Surname
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('email')">
                        <i class="bi" [class.bi-sort-alpha-down]="sortKey === 'email' && sortDirection === 'asc'"
                            [class.bi-sort-alpha-up]="sortKey === 'email' && sortDirection === 'desc'"></i>
                        Email
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('role')">
                        <i class="bi" [class.bi-sort-alpha-down]="sortKey === 'role' && sortDirection === 'asc'"
                            [class.bi-sort-alpha-up]="sortKey === 'role' && sortDirection === 'desc'"></i>
                        Role
                    </th>
                    <th class="clickable-area" scope="col" (click)="sortBy('credit')">
                        <i class="bi" [class.bi-sort-numeric-down]="sortKey === 'credit' && sortDirection === 'asc'"
                            [class.bi-sort-numeric-up]="sortKey === 'credit' && sortDirection === 'desc'"></i>
                        Credit
                    </th>
                    <th class="clickable-area" scope="col">Actions</th>
                </tr>
            </thead>
            <tbody>
                @for (u of allUsers; track u.id) {
                <tr>
                    <td>{{ u.id }}</td>
                    <td>{{ u.firstName }}</td>
                    <td>{{ u.lastName }}</td>
                    <td>{{ u.email }}</td>
                    <td>{{ u.role }}</td>
                    <td>{{ u.credit }}</td>
                    <td>
                        <button class="btn btn-sm btn-primary me-2" (click)="editUser(u)">
                            <i class="bi bi-pencil"></i> Edit
                        </button>
                        <button class="btn btn-sm btn-secondary me-2" (click)="resetPassword(u)">
                            <i class="bi bi-asterisk"></i> Change Pass
                        </button>
                        <button class="btn btn-sm btn-danger" (click)="deleteUser(u.id)"
                            [disabled]="u.id == currentUserId()">
                            <i class="bi bi-trash"></i> Delete
                        </button>
                    </td>
                </tr>
                } @empty {
                <tr>
                    <td colspan="7" class="text-center text-muted">Nessuno user trovato.</td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>

@if (mostraResetPass) {
<app-reset-pass [userId]="idUtenteSelezionato" (confermato)="eseguiResetPassword($event)"
    (annullato)="mostraResetPass = false">
</app-reset-pass>
}
