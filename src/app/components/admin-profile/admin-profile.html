<main class="main-content">
        <div class="profile-card">
            
            <h2>Profile</h2>
            
            <div class="profile-details">
                <div class="detail-row">
                    <span class="label">Name:</span>
                    <span class="value">{{ currentUser?.firstName }}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Surname:</span>
                    <span class="value">{{ currentUser?.lastName }}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Email:</span>
                    <span class="value">{{ currentUser?.email }}</span>
                </div>
                <div class="detail-row">
                    <span class="label">Role:</span>
                    <span class="badge-admin">{{ currentUser?.role }}</span>
                </div>
            </div>

            <div class="profile-actions">
                <button (click)="EditProfile(currentUser.id)" class="btn btn-secondary">Edit Profile</button>
                <button (click)="ResetPassword()" class="btn btn-primary">Reset Password</button>
            </div>

        </div>
        @if (mostraResetPass) {
<app-reset-pass [userId]="currentUser.id" (confermato)="eseguiResetPassword($event)"
    (annullato)="mostraResetPass = false">
</app-reset-pass>
}
    </main>
