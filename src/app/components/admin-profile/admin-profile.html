<main class="container-fluid py-4">
    <div class="card mx-auto" style="max-width: 42rem;">
        <div class="card-body p-4">
            <h2 class="card-title h3 mb-4">Profile</h2>

            <div class="border rounded overflow-hidden mb-4">
                <div class="row m-0 p-3 align-items-center border-bottom">
                    <div class="col-3 fw-bold">Name:</div>
                    <div class="col-9">{{ currentUser?.firstName }}</div>
                </div>

                <div class="row m-0 p-3 align-items-center border-bottom bg-body-secondary">
                    <div class="col-3 fw-bold">Surname:</div>
                    <div class="col-9">{{ currentUser?.lastName }}</div>
                </div>

                <div class="row m-0 p-3 align-items-center border-bottom">
                    <div class="col-3 fw-bold">Email:</div>
                    <div class="col-9">{{ currentUser?.email }}</div>
                </div>

                <div class="row m-0 p-3 align-items-center bg-body-secondary">
                    <div class="col-3 fw-bold">Role:</div>
                    <div class="col-9">
                        <span class="badge bg-primary">{{ currentUser?.role }}</span>
                    </div>
                </div>
            </div>

            <div class="d-flex gap-2">
                <button (click)="EditProfile(currentUser.id)" class="btn btn-secondary">
                    Edit Profile
                </button>
                <button (click)="ResetPassword()" class="btn btn-primary">
                    Reset Password
                </button>
            </div>

        </div>
    </div>

    @if (mostraResetPass) {
    <div class="mt-4 mx-auto" style="max-width: 42rem;">
        <app-reset-pass [userId]="currentUser.id" (confermato)="eseguiResetPassword($event)"
            (annullato)="mostraResetPass = false">
        </app-reset-pass>
    </div>
    }
</main>
